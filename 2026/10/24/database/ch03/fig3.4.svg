<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Noto Sans TC','Segoe UI',Arial,sans-serif">
<title>(min,max) 與基數比例的對照</title>
<rect width="760" height="330" fill="#ffffff"/>
<line x1="130" y1="70" x2="380" y2="70" stroke="#7b8794" stroke-width="1.6"/>
<line x1="380" y1="70" x2="630" y2="70" stroke="#7b8794" stroke-width="1.6"/>
<line x1="130" y1="265" x2="380" y2="265" stroke="#7b8794" stroke-width="1.6"/>
<line x1="380" y1="265" x2="630" y2="265" stroke="#7b8794" stroke-width="1.6"/>
<rect x="10.0" y="48.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="70" y="75" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">EMPLOYEE</text>
<rect x="630.0" y="48.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="690" y="75" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">DEPARTMENT</text>
<polygon points="380,41.0 445.0,70 380,99.0 315.0,70" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="380" y="74" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">WORKS_FOR</text>
<text x="160" y="58" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">(1,1)</text>
<text x="600" y="58" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">(1,N)</text>
<text x="160" y="125" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="normal">每個 EMPLOYEE 恰好屬於 1 個 DEPARTMENT</text>
<text x="600" y="125" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="normal">每個 DEPARTMENT 有 1 到 N 位 EMPLOYEE</text>
<text x="380" y="160" font-size="12.5" text-anchor="middle" fill="#7b8794" font-weight="normal">(min, max) 標在自己這一側，往對方看</text>
<text x="380" y="215" font-size="30" text-anchor="middle" fill="#d9822b" font-weight="bold">=</text>
<rect x="10.0" y="243.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="70" y="270" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">EMPLOYEE</text>
<rect x="630.0" y="243.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="690" y="270" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">DEPARTMENT</text>
<polygon points="380,236.0 445.0,265 380,294.0 315.0,265" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="380" y="269" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">WORKS_FOR</text>
<text x="160" y="253" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">N</text>
<text x="600" y="253" font-size="15" text-anchor="middle" fill="#d9822b" font-weight="bold">1</text>
<text x="380" y="315" font-size="12.5" text-anchor="middle" fill="#7b8794" font-weight="normal">比例 (ratio) 的數字標在對方那一側，意思剛好相反</text>
</svg>
