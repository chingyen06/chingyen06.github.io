<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="'Noto Sans TC','Segoe UI',Arial,sans-serif">
<title>三元關係與三個二元關係</title>
<rect width="800" height="360" fill="#ffffff"/>
<line x1="80" y1="60" x2="200" y2="150" stroke="#7b8794" stroke-width="1.6"/>
<line x1="320" y1="60" x2="200" y2="150" stroke="#7b8794" stroke-width="1.6"/>
<line x1="200" y1="270" x2="200" y2="150" stroke="#7b8794" stroke-width="1.6"/>
<line x1="490" y1="60" x2="610" y2="60" stroke="#7b8794" stroke-width="1.6"/>
<line x1="610" y1="60" x2="730" y2="60" stroke="#7b8794" stroke-width="1.6"/>
<line x1="490" y1="60" x2="530" y2="170" stroke="#7b8794" stroke-width="1.6"/>
<line x1="530" y1="170" x2="610" y2="270" stroke="#7b8794" stroke-width="1.6"/>
<line x1="730" y1="60" x2="690" y2="170" stroke="#7b8794" stroke-width="1.6"/>
<line x1="690" y1="170" x2="610" y2="270" stroke="#7b8794" stroke-width="1.6"/>
<rect x="20.0" y="38.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="80" y="65" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">SUPPLIER</text>
<rect x="260.0" y="38.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="320" y="65" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">PROJECT</text>
<rect x="140.0" y="248.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="200" y="275" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">PART</text>
<polygon points="200,121.0 262.0,150 200,179.0 138.0,150" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="200" y="154" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">SUPPLY</text>
<rect x="430.0" y="38.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="490" y="65" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">SUPPLIER</text>
<rect x="670.0" y="38.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="730" y="65" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">PROJECT</text>
<rect x="550.0" y="248.0" width="120" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="610" y="275" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">PART</text>
<polygon points="610,35.0 665.0,60 610,85.0 555.0,60" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="610" y="64" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">SUPPLIES</text>
<polygon points="530,145.0 588.0,170 530,195.0 472.0,170" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="530" y="174" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">CAN_SUPPLY</text>
<polygon points="690,145.0 735.0,170 690,195.0 645.0,170" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="690" y="174" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">USES</text>
<text x="200" y="335" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">一個 ternary relationship</text>
<text x="610" y="335" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">三個 binary relationship</text>
<text x="400" y="170" font-size="34" text-anchor="middle" fill="#d9822b" font-weight="bold">≠</text>
</svg>
