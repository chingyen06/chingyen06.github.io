<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'Noto Sans TC','Segoe UI',Arial,sans-serif">
<title>關係的閱讀方向</title>
<rect width="720" height="300" fill="#ffffff"/>
<line x1="150" y1="70" x2="360" y2="70" stroke="#7b8794" stroke-width="1.6"/>
<line x1="360" y1="70" x2="570" y2="70" stroke="#7b8794" stroke-width="1.6"/>
<line x1="150" y1="200" x2="360" y2="200" stroke="#7b8794" stroke-width="1.6"/>
<line x1="360" y1="200" x2="570" y2="200" stroke="#7b8794" stroke-width="1.6"/>
<rect x="30.0" y="48.0" width="140" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="100" y="75" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">DEPARTMENT</text>
<rect x="550.0" y="48.0" width="140" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="620" y="75" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">EMPLOYEE</text>
<polygon points="360,41.0 425.0,70 360,99.0 295.0,70" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="360" y="74" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">EMPLOYS</text>
<text x="360" y="122" font-size="13" text-anchor="middle" fill="#7b8794" font-weight="normal">讀作：DEPARTMENT employs EMPLOYEE</text>
<rect x="30.0" y="178.0" width="140" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="100" y="205" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">EMPLOYEE</text>
<rect x="550.0" y="178.0" width="140" height="44" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2"/>
<text x="620" y="205" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">DEPARTMENT</text>
<polygon points="360,171.0 425.0,200 360,229.0 295.0,200" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="360" y="204" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">WORKS_FOR</text>
<text x="360" y="252" font-size="13" text-anchor="middle" fill="#7b8794" font-weight="normal">讀作：EMPLOYEE works for DEPARTMENT</text>
<text x="360" y="282" font-size="12" text-anchor="middle" fill="#7b8794" font-weight="normal">由左至右、由上至下閱讀，菱形名稱是動詞</text>
</svg>
