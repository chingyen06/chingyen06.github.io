<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" font-family="'Noto Sans TC','Segoe UI',Arial,sans-serif">
<title>superkey、key 與 primary key</title>
<rect width="760" height="455" fill="#ffffff"/>
<ellipse cx="380" cy="220" rx="355" ry="195" fill="#f5f7fa" stroke="#7b8794" stroke-width="2.2"/>
<ellipse cx="300" cy="265" rx="235" ry="120" fill="#eaf2fb" stroke="#4f86c6" stroke-width="2.2"/>
<ellipse cx="235" cy="285" rx="120" ry="50" fill="#fff4e5" stroke="#d9822b" stroke-width="2.2"/>
<text x="380" y="65" font-size="17" text-anchor="middle" fill="#2c3e50" font-weight="bold">superkey</text>
<text x="380" y="87" font-size="12" text-anchor="middle" fill="#7b8794" font-weight="normal">任何保證唯一的 attribute 集合</text>
<text x="300" y="188" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">key (candidate key)</text>
<text x="300" y="208" font-size="12" text-anchor="middle" fill="#7b8794" font-weight="normal">最小的 superkey</text>
<text x="235" y="282" font-size="15" text-anchor="middle" fill="#2c3e50" font-weight="bold">primary key</text>
<text x="235" y="302" font-size="13" text-anchor="middle" fill="#d9822b" font-weight="normal">{SerialNo}</text>
<text x="300" y="240" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="normal">{State, Reg#}</text>
<text x="580" y="170" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="normal">{SerialNo, Make}</text>
<text x="580" y="195" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="normal">{State, Reg#, Year}</text>
<text x="580" y="220" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="normal">{SerialNo, Model, Year}</text>
<text x="580" y="245" font-size="12" text-anchor="middle" fill="#7b8794" font-weight="normal">包含 key 的集合</text>
<text x="380" y="438" font-size="12.5" text-anchor="middle" fill="#7b8794" font-weight="normal">CAR(State, Reg#, SerialNo, Make, Model, Year)</text>
</svg>
